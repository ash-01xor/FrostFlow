name: cold-chain
services:
  communication:
    build: ./deployer
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      ZEEBE_ADDRESS: zeebe:26500
      BPMN_FILE: /bpmn/shipment_preparation.bpmn
      P2_BPMN_FILE: /bpmn/transport.bpmn
      P3_BPMN_FILE: /bpmn/receiving.bpmn
      P5_BPMN_FILE: /bpmn/corrective_fulfilment.bpmn
      P6_BPMN_FILE: /bpmn/supplier_claim.bpmn
      REGISTRY_PATH: /data/registry.sqlite
      GPS_TICK_SECONDS: ${GPS_TICK_SECONDS:-5}
      P2_SIMULATOR_ENABLED: ${P2_SIMULATOR_ENABLED:-true}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      SIDDIHI_TELEMETRY_URL: ${SIDDIHI_TELEMETRY_URL:-http://siddhi:8006/telemetry}
      SIDDIHI_COMMAND_URL: ${SIDDIHI_COMMAND_URL:-http://siddhi:8007/route-command}
      SIDDIHI_CONTAINER_URL: ${SIDDIHI_CONTAINER_URL:-http://siddhi:8008/container}
      MONITORING_PROFILE_JSON: ${MONITORING_PROFILE_JSON:-{}}
      P3_ARRIVAL_URL: ${P3_ARRIVAL_URL:-http://communication:5001/integrations/p3/arrival}
      P4_INCIDENT_URL: ${P4_INCIDENT_URL-http://communication:5001/integrations/p4/incident}
      # P4 cooling commands (docs/P4-COOLING-CONTRACT.md). Empty: labelled manual-test
      # acknowledgement/recovery input. Set to the Siddhi cooling-command bridge once the
      # simulator/Siddhi side of issue #17 exists.
      P4_COOLING_COMMAND_URL: ${P4_COOLING_COMMAND_URL:-}
      P4_COOLING_ACK_TIMEOUT_SECONDS: ${P4_COOLING_ACK_TIMEOUT_SECONDS:-45}
      # P4 DCR engine: dcrgraphs.net repository when all three DCR_* values are set
      # (put them in an untracked .env), otherwise the local engine on the same graph.
      DCR_MODE: ${DCR_MODE:-auto}
      DCR_MODEL_FILE: /dcr/p4_quality_investigation.xml
      DCR_GRAPH_ID: ${DCR_GRAPH_ID:-}
      DCR_USERNAME: ${DCR_USERNAME:-}
      DCR_PASSWORD: ${DCR_PASSWORD:-}
    volumes:
      - ./bpmn:/bpmn:ro
      - ./dcr:/dcr:ro
      - ${REGISTRY_DIR:-./runtime}:/data
    depends_on:
      - zeebe
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:5001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  zeebe:
    image: camunda/zeebe:8.8.0
    ports:
      - "127.0.0.1:26501:26500"
      - "127.0.0.1:9601:9600"
    environment:
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
      CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
    volumes:
      - zeebe-data:/usr/local/zeebe/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  siddhi:
    image: siddhiio/siddhi-runner-alpine:latest
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:8007:8007"
      - "127.0.0.1:8008:8008"
    volumes:
      - ./siddhi-apps:/apps:ro
    command: ["-Dapps=/apps"]

  operate:
    image: camunda/operate:8.8.0
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      zeebe:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_SECURITY_AUTHENTICATION_METHOD: basic
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME: Demo User
      CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_0: demo

volumes:
  zeebe-data:
  elasticsearch-data:
